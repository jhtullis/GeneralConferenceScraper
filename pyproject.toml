[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "general-conference-scraper"
version = "0.1.0"
description = "Scraper and classification tools for LDS General Conference talks"
requires-python = ">=3.9"
dependencies = [
    "requests",
    "beautifulsoup4",
    "html5lib",
    "pandas",
    "tqdm",
]

[tool.setuptools]
packages = ["scraper", "classification"]
